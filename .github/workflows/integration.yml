name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run integration tests
        run: go test -tags=integration -count=1 -timeout 5m ./tests/integration/...
        env:
          TRANSLAAS_API_KEY: ${{ secrets.TRANSLAAS_API_KEY }}
          TRANSLAAS_BASE_URL: ${{ secrets.TRANSLAAS_BASE_URL }}
