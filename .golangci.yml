run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - gofumpt
    - misspell
    - revive
    - unconvert
    - unparam
    - bodyclose
    - noctx

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - disableStutteringCheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
